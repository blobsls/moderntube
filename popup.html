<!DOCTYPE html>
<html>
<head>
  <title>moderntube settings</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: 'Roboto', Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #FF0000;
    }
    .option {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }
    select, button {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: white;
    }
    button {
      background: #FF0000;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #CC0000;
    }
  </style>
</head>
<body>
  <h1>Modern YouTube Settings</h1>
  
  <div class="option">
    <label for="theme">Color Theme:</label>
    <select id="theme">
      <option value="default">Default</option>
      <option value="ocean">Ocean</option>
      <option value="forest">Forest</option>
      <option value="sunset">Sunset</option>
    </select>
  </div>
  
  <div class="option">
    <label for="darkMode">Dark Mode:</label>
    <select id="darkMode">
      <option value="auto">Auto</option>
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </div>
  
  <div class="option">
    <label>
      <input type="checkbox" id="minimalist"> Minimalist Mode
    </label>
  </div>
  
  <button id="save">Save Settings</button>
  
  <script src="popup.js"></script>
</body>
</html>
